bundle:
  name: dab-demo

include:
  - resources/job.yml
  - resources/schemas.yml
  - resources/volume.yml
  - resources/pipelines.yml
  # catalog.yml intentionally excluded — dev_catalog is assumed to pre-exist in the workspace

variables:
  catalog_name:
    description: Unity Catalog Name
  bronze_schema_name:
    description: Bronze schema name within the catalog
  silver_schema_name:
    description: Silver schema name within the catalog
  gold_schema_name:
    description: Gold schema name within the catalog
  contracts_volume_name:
    description: Contracts Volume name within the schema
  landing_volume_name:
    description: Landing Volume name within the schema
  # catalog_storage_root:
  #   description: Storage root path for the catalog (must be under a registered UC external location)

targets:
  dev:
    default: true

    variables:
      catalog_name: dev_catalog
      bronze_schema_name: bronze
      silver_schema_name: silver
      gold_schema_name: gold
      contracts_volume_name: contracts_volume
      landing_volume_name: landing
      # catalog_storage_root: "abfss://<container>@<storage-account>.dfs.core.windows.net/dev_catalog"

    run_as:
      service_principal_name: f9f96bff-7756-487f-9e00-0353ebf5935d